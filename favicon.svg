<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f3ff" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="rocket-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f3ff" />
    </linearGradient>

    <linearGradient id="flame-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glass Glow Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="node-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Squircle background -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bg-grad)" stroke="url(#accent-grad)" stroke-width="8" />

  <!-- Inner Glass Ring -->
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Graph Connection Lines (Distributed Network / Mind Map) -->
  <g stroke="url(#accent-grad)" stroke-width="4" stroke-opacity="0.5" stroke-dasharray="8 6">
    <!-- Node connections -->
    <line x1="140" y1="360" x2="256" y2="150" />
    <line x1="372" y1="360" x2="256" y2="150" />
    <line x1="140" y1="360" x2="372" y2="360" />
    <line x1="140" y1="360" x2="256" y2="390" />
    <line x1="372" y1="360" x2="256" y2="390" />
    <line x1="256" y1="150" x2="256" y2="80" />
  </g>

  <!-- Network Nodes -->
  <g filter="url(#node-glow)">
    <circle cx="256" cy="80" r="14" fill="#00f3ff" />
    <circle cx="140" cy="360" r="14" fill="#8b5cf6" />
    <circle cx="372" cy="360" r="14" fill="#3b82f6" />
    <circle cx="256" cy="390" r="12" fill="#06b6d4" />
  </g>

  <!-- Rocket Main Body (Architecture Launch Theme) -->
  <g filter="url(#glow)">
    <!-- Flame / Thrust -->
    <path d="M 236 340 Q 256 420 276 340 Q 256 370 236 340 Z" fill="url(#flame-grad)" opacity="0.95" />
    <path d="M 244 340 Q 256 390 268 340 Z" fill="#fef08a" />

    <!-- Left Wing -->
    <path d="M 216 280 L 176 330 Q 216 335 224 300 Z" fill="#2563eb" />
    
    <!-- Right Wing -->
    <path d="M 296 280 L 336 330 Q 296 335 288 300 Z" fill="#7c3aed" />

    <!-- Main Rocket Fuselage -->
    <path d="M 256 120 C 216 200 216 290 224 330 L 288 330 C 296 290 296 200 256 120 Z" fill="url(#rocket-grad)" />

    <!-- Porthole / Core Gem -->
    <circle cx="256" cy="220" r="24" fill="#030712" stroke="#00f3ff" stroke-width="5" />
    <circle cx="256" cy="220" r="12" fill="#00f3ff" />
    <circle cx="252" cy="216" r="4" fill="#ffffff" />
  </g>
</svg>
